<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Forecast - Incursio</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .current-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
      text-align: center;
      padding: 32px 16px;
    }
    .current-temp {
      font-size: 64px;
      font-weight: 700;
      color: white;
      line-height: 1;
      margin-bottom: 8px;
    }
    .current-condition {
      font-size: 18px;
      color: var(--cyan);
      margin-bottom: 24px;
      font-weight: 600;
    }
    .current-details {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--card-border);
      padding-top: 16px;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .detail-item svg {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    
    .day-card {
      min-width: 80px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .day-name { font-weight: 600; color: white; margin-bottom: 4px; }
    .day-date { font-size: 12px; margin-bottom: 8px; }
    .day-icon svg { width: 24px; height: 24px; color: var(--cyan); margin-bottom: 8px; }
    .day-temps { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    
    .rain-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .rain-bar {
      height: 100%;
      background: var(--primary);
    }
    
    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="content-area">
      <h1 style="margin-bottom: 4px;">10-Day Forecast</h1>
      <p id="location-subtitle" style="margin-bottom: 20px;">India</p>

      <div class="card current-card">
        <div class="current-temp" id="main-temp">--°</div>
        <div class="current-condition" id="main-condition">Loading...</div>
        <div class="current-details">
          <div class="detail-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" /></svg>
            <span id="main-wind">--</span>
          </div>
          <div class="detail-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12 7.5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0112 7.5zm0 9a.75.75 0 100-1.5.75.75 0 000 1.5z" /></svg>
            <span id="main-humidity">--</span>
          </div>
          <div class="detail-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" /></svg>
            <span id="main-pressure">--</span>
          </div>
        </div>
      </div>

      <div class="h-scroll" id="forecast-strip">
        <!-- Javascript will populate 10 days here -->
      </div>

      <h2 style="margin: 24px 0 16px;">Precipitation</h2>
      <div class="chart-container">
        <canvas id="precipChart" height="150"></canvas>
      </div>

      <h2 style="margin: 24px 0 16px;">Wind Speed</h2>
      <div class="chart-container">
        <canvas id="windChart" height="150"></canvas>
      </div>

      <p style="text-align: center; font-size: 12px; margin: 24px 0 40px;">Data: Open-Meteo | Updated hourly</p>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    const wmoMap = {
      0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
      45: 'Fog', 48: 'Depositing rime fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle',
      61: 'Rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Snow', 73: 'Snow', 75: 'Heavy snow',
      95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Heavy thunderstorm'
    };

    function getIconSVG(code) {
      if (code <= 3) {
        return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>`;
      } else if (code < 70) {
        return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2.25m0 0v2.25m0-2.25h2.25m-2.25 0H9.75M2.25 12a9.75 9.75 0 1119.5 0 9.75 9.75 0 01-19.5 0z" /></svg>`;
      } else {
        return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5z" /></svg>`;
      }
    }

    async function initForecast() {
      const savedLoc = JSON.parse(localStorage.getItem('incursio_location') || 'null');
      const lat = savedLoc ? savedLoc.lat : 20.5;
      const lon = savedLoc ? savedLoc.lon : 78.9;
      const locName = savedLoc ? savedLoc.name : 'India';
      
      document.getElementById('location-subtitle').textContent = locName;

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&forecast_days=10&timezone=auto`);
        const data = await res.json();
        
        // Current
        document.getElementById('main-temp').textContent = Math.round(data.current.temperature_2m) + '°';
        document.getElementById('main-condition').textContent = wmoMap[data.current.weather_code] || 'Unknown';
        document.getElementById('main-wind').textContent = Math.round(data.current.wind_speed_10m) + ' km/h';
        document.getElementById('main-humidity').textContent = Math.round(data.current.relative_humidity_2m) + '%';
        document.getElementById('main-pressure').textContent = Math.round(data.current.surface_pressure) + ' hPa';

        // Strip
        const strip = document.getElementById('forecast-strip');
        strip.innerHTML = '';
        for (let i = 0; i < 10; i++) {
          const date = new Date(data.daily.time[i]);
          const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
          const dayDate = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          const prob = data.daily.precipitation_probability_max[i];
          const code = data.daily.weather_code[i];
          
          strip.innerHTML += `
            <div class="day-card">
              <div class="day-name">${i === 0 ? 'Today' : dayName}</div>
              <div class="day-date">${dayDate}</div>
              <div class="day-icon">${getIconSVG(code)}</div>
              <div class="day-temps">${max}° <span style="color:var(--text-secondary)">${min}°</span></div>
              <div class="rain-bar-container"><div class="rain-bar" style="width:${prob}%"></div></div>
            </div>
          `;
        }

        // Charts
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = 'Inter';
        
        const labels = data.daily.time.map(t => new Date(t).toLocaleDateString('en-US', { weekday: 'short' }));
        
        new Chart(document.getElementById('precipChart'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Precipitation (mm)',
              data: data.daily.precipitation_sum,
              backgroundColor: '#06b6d4',
              borderRadius: 4
            }]
          },
          options: { scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
        });

        new Chart(document.getElementById('windChart'), {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Max Wind Speed (km/h)',
              data: data.daily.wind_speed_10m_max,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              fill: true,
              tension: 0.4
            }]
          },
          options: { scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
        });

      } catch (e) {
        console.error("Failed to fetch forecast", e);
      }
    }
    
    initForecast();
  </script>
</body>
</html>
